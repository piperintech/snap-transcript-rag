<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAP Transcript Translator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Arsenal:ital@0;1&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gray: #f5f5f5;
            --navy-deep: #051c2b;
            --navy: #0a2840;
            --accent: #051c2b;
            
            --ink: #051c2b;
            --ink-soft: #2d4257;
            --ink-muted: #5d6e80;
            --on-dark: #ffffff;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-gray);
            color: var(--ink);
            line-height: 1.6;
        }

        h1, h2 {
            font-family: 'Arsenal', serif;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            border-bottom: 1px solid rgba(5, 28, 43, 0.10);
            background: white;
            margin-bottom: 32px;
        }

        .top-bar h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
        }

        .kb-link-btn {
            padding: 10px 18px;
            border: 1px solid rgba(5, 28, 43, 0.15);
            background: white;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .kb-link-btn:hover {
            background: #f0f0f0;
            border-color: var(--accent);
        }

        .app {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            padding: 0 32px 32px;
            max-width: 1400px;
            margin: 0 auto;
            height: calc(100vh - 80px);
        }

        @media (max-width: 900px) {
            .top-bar {
                padding: 12px 16px;
            }

            .app {
                grid-template-columns: 1fr;
                height: auto;
                padding: 0 16px 16px;
                gap: 16px;
                margin-bottom: 32px;
            }
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 12px;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--ink-muted);
        }

        .panel {
            background: white;
            border: 1px solid rgba(5, 28, 43, 0.08);
            border-radius: 12px;
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        textarea {
            flex: 1;
            border: 1px solid rgba(5, 28, 43, 0.10);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: none;
            background: white;
            color: var(--ink);
            margin-bottom: 16px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 146, 200, 0.1);
        }

        textarea::placeholder {
            color: var(--ink-muted);
        }

        .output-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid rgba(5, 28, 43, 0.08);
            margin-bottom: 16px;
        }

        .tab-button {
            background: transparent;
            border: none;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink-muted);
            cursor: pointer;
            transition: color 0.2s;
            position: relative;
        }

        .tab-button:hover {
            color: var(--ink-soft);
        }

        .tab-button.active {
            color: var(--accent);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
        }

        .tab-content {
            display: none;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        .output-text {
            flex: 1;
            background: #ececf1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: var(--ink);
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 12px;
        }

        .output-text.empty {
            color: var(--ink-muted);
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .summary-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: center;
            justify-content: flex-end;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 10px 16px;
            border: 1px solid rgba(5, 28, 43, 0.15);
            background: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: #f0f0f0;
            border-color: var(--accent);
        }

        button:active {
            transform: scale(0.98);
        }

        button.primary {
            background: var(--navy-deep);
            color: var(--on-dark);
            border-color: var(--navy-deep);
        }

        button.primary:hover {
            background: var(--navy);
            border-color: var(--navy);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: center;
            display: none;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .status.show {
            display: block;
        }

        .status.processing {
            background: #f0f0f0;
            color: var(--accent);
        }

        .status.error {
            background: rgba(220, 53, 69, 0.12);
            color: #c41c3b;
        }

        .status.success {
            background: rgba(40, 167, 69, 0.12);
            color: #155724;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>SNAP Transcript Translator</h1>
        <a href="snap-kb-manager.html" class="kb-link-btn">KB Manager</a>
    </div>

    <div class="app">
        <!-- Left Column: Original Transcript -->
        <div class="column">
            <div class="header">
                <h2>Original Transcript</h2>
                <p class="subtitle">Paste English or Spanish call transcript</p>
            </div>
            <div class="panel">
                <textarea id="transcript" placeholder="Paste your call transcript here..."></textarea>
                <div id="inputStatus" class="status"></div>
                <div class="controls">
                    <button class="primary" id="processBtn">Process</button>
                    <button id="clearInput">Clear</button>
                </div>
            </div>
        </div>

        <!-- Right Column: Results -->
        <div class="column">
            <div class="header">
                <h2>Results</h2>
                <p class="subtitle">Translation and summaries</p>
            </div>
            <div class="panel">
                <div class="output-area">
                    <div class="tabs">
                        <button class="tab-button active" data-tab="translation">Translation</button>
                        <button class="tab-button" data-tab="mt-entry">MT Entry</button>
                        <button class="tab-button" data-tab="claims">Claims Summary</button>
                    </div>

                    <!-- Translation Tab -->
                    <div class="tab-content active" id="tab-translation">
                        <div id="translatedText" class="output-text empty">Ready for translation...</div>
                    </div>

                    <!-- MT Entry Tab -->
                    <div class="tab-content" id="tab-mt-entry">
                        <div class="summary-controls">
                            <button class="primary" id="generateMtBtn">Generate</button>
                        </div>
                        <div id="mtEntryText" class="output-text empty">Ultra-compact for MODOTECH...</div>
                    </div>

                    <!-- Claims Summary Tab -->
                    <div class="tab-content" id="tab-claims">
                        <div class="summary-controls">
                            <button class="primary" id="generateClaimsBtn">Generate</button>
                        </div>
                        <div id="claimsText" class="output-text empty">Professional claims summary...</div>
                    </div>

                    <div id="outputStatus" class="status"></div>

                    <div class="button-row">
                        <button id="copyOutput" style="display: none;">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let knowledgeBase = null;
        const kbUrl = 'snap-knowledge-base.json';

        fetch(kbUrl)
            .then(r => r.json())
            .then(data => {
                knowledgeBase = data;
                console.log('Knowledge base loaded:', knowledgeBase.metadata);
            })
            .catch(err => console.warn('KB not found'));

        const transcriptInput = document.getElementById('transcript');
        const processBtn = document.getElementById('processBtn');
        const clearBtn = document.getElementById('clearInput');
        const translatedText = document.getElementById('translatedText');
        const mtEntryText = document.getElementById('mtEntryText');
        const claimsText = document.getElementById('claimsText');
        const generateMtBtn = document.getElementById('generateMtBtn');
        const generateClaimsBtn = document.getElementById('generateClaimsBtn');
        const inputStatus = document.getElementById('inputStatus');
        const outputStatus = document.getElementById('outputStatus');
        const copyBtn = document.getElementById('copyOutput');

        let currentTab = 'translation';
        let translationData = '';

        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.dataset.tab;
                document.getElementById(`tab-${currentTab}`).classList.add('active');
                updateCopyButton();
            });
        });

        function showStatus(element, message, type) {
            element.textContent = message;
            element.className = `status show ${type}`;
            if (type === 'success') setTimeout(() => element.classList.remove('show'), 2500);
        }

        function updateCopyButton() {
            let text = '';
            if (currentTab === 'translation') text = translatedText.textContent;
            if (currentTab === 'mt-entry') text = mtEntryText.textContent;
            if (currentTab === 'claims') text = claimsText.textContent;
            
            if (text && !text.includes('Ready') && !text.includes('Ultra-compact') && !text.includes('Professional')) {
                copyBtn.style.display = 'block';
            } else {
                copyBtn.style.display = 'none';
            }
        }

        clearBtn.addEventListener('click', () => {
            transcriptInput.value = '';
            translatedText.textContent = 'Ready for translation...';
            translatedText.classList.add('empty');
            mtEntryText.textContent = 'Ultra-compact for MODOTECH...';
            mtEntryText.classList.add('empty');
            claimsText.textContent = 'Professional claims summary...';
            claimsText.classList.add('empty');
            copyBtn.style.display = 'none';
            inputStatus.classList.remove('show');
        });

        processBtn.addEventListener('click', async () => {
            const transcript = transcriptInput.value.trim();
            if (!transcript) {
                showStatus(inputStatus, 'Paste a transcript first', 'error');
                return;
            }

            showStatus(inputStatus, 'Processing...', 'processing');
            processBtn.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/claude-api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-6',
                        max_tokens: 2000,
                        messages: [{
                            role: 'user',
                            content: `You are Manu, a bilingual operations and technology leader at SNAP Insurance Service LLC. Translate this insurance claim call transcript with precision.

SNAP Abbreviations (always use these):
IV=Insured Vehicle, CV=Claimant Vehicle, R/E=Rear Ended, CLMT=Claimant, INSD=Insured, PSGR=Passenger, PKG LOT=Parking Lot, APTS=Apartments, UNINS=Uninsured

Your voice: Direct, practical, detail-oriented. Professional but human. No filler.

Translate this call transcript to clear, professional English. If already in English, clean it up for clarity and consistency. Preserve all claim-relevant details. Maintain the insured's exact account.

Transcript:
${transcript}

Provide ONLY the clean English translation, preserving original structure and speaker labels.`
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.content?.[0]?.text) {
                    translationData = data.content[0].text;
                    translatedText.textContent = translationData;
                    translatedText.classList.remove('empty');
                    showStatus(inputStatus, 'Done', 'success');
                } else {
                    throw new Error('No translation received');
                }
            } catch (error) {
                showStatus(inputStatus, `Error: ${error.message}`, 'error');
            } finally {
                processBtn.disabled = false;
            }
        });

        generateMtBtn.addEventListener('click', async () => {
            if (!translationData) {
                showStatus(outputStatus, 'Process a transcript first', 'error');
                return;
            }

            showStatus(outputStatus, 'Generating...', 'processing');
            generateMtBtn.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/claude-api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-6',
                        max_tokens: 500,
                        messages: [{
                            role: 'user',
                            content: `You are Manu, a SNAP Insurance adjuster creating a MODOTECH entry. Ultra-compact, ultra-fast.

MT ENTRY RULES:
- Use ALL CAPS
- Abbreviations only: IV, CV, R/E, CLMT, INSD, PSGR, PKG LOT, APTS, UNINS
- 1-3 sentences maximum
- Focus: location, vehicles, sequence, injuries, liability indicator

Example: "IV R/E CV (2014 MITZ LANCER, DRIVER LUIS QUEZADA) AT 7100 BLK MILITARY PARKWAY ~6:25AM. CLMT STATED BRAKES FAILED."

Transcript:
${translationData}

Provide ONLY the ultra-compact MT entry.`
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.content?.[0]?.text) {
                    mtEntryText.textContent = data.content[0].text;
                    mtEntryText.classList.remove('empty');
                    showStatus(outputStatus, 'Done', 'success');
                    updateCopyButton();
                } else {
                    throw new Error('No MT entry received');
                }
            } catch (error) {
                showStatus(outputStatus, `Error: ${error.message}`, 'error');
            } finally {
                generateMtBtn.disabled = false;
            }
        });

        generateClaimsBtn.addEventListener('click', async () => {
            if (!translationData) {
                showStatus(outputStatus, 'Process a transcript first', 'error');
                return;
            }

            showStatus(outputStatus, 'Generating...', 'processing');
            generateClaimsBtn.disabled = true;

            try {
                const response = await fetch('/.netlify/functions/claude-api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-6',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: `You are Manu, a SNAP Insurance adjuster writing a professional claims summary. Your voice: direct, practical, thorough.

CLAIMS SUMMARY FORMAT:
- Professional narrative (3-5 sentences)
- Include all material details
- Organize by: scene, vehicles, sequence, injuries, damages, liability
- Use complete language (not ALL CAPS)
- Standard abbreviations only: IV, CV, R/E, CLMT, INSD, PSGR, PKG LOT, APTS, UNINS
- Written for adjuster case review

Transcript:
${translationData}

Provide ONLY the professional claims summary narrative.`
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.content?.[0]?.text) {
                    claimsText.textContent = data.content[0].text;
                    claimsText.classList.remove('empty');
                    showStatus(outputStatus, 'Done', 'success');
                    updateCopyButton();
                } else {
                    throw new Error('No claims summary received');
                }
            } catch (error) {
                showStatus(outputStatus, `Error: ${error.message}`, 'error');
            } finally {
                generateClaimsBtn.disabled = false;
            }
        });

        copyBtn.addEventListener('click', () => {
            let text = '';
            if (currentTab === 'translation') text = translatedText.textContent;
            if (currentTab === 'mt-entry') text = mtEntryText.textContent;
            if (currentTab === 'claims') text = claimsText.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                setTimeout(() => copyBtn.textContent = originalText, 2000);
            });
        });
    </script>
</body>
</html>
